<div class="profile-hero reveal" aria-labelledby="hero-title">
  <canvas class="profile-hero__field" id="experienceField" aria-hidden="true"></canvas>

  <button class="motion-toggle" type="button" data-motion-toggle aria-label="Pause background motion" title="Pause background motion">
    <i class="bi bi-pause-fill" aria-hidden="true"></i>
  </button>

  <div class="profile-hero__copy">
    <p class="hero-kicker"><span aria-hidden="true"></span>{{ site.author.location }}</p>
    <h1 id="hero-title">
      <span>{{ site.author.name }}</span>
      <strong>{{ site.author.role }}</strong>
    </h1>
    <p class="hero-summary">{{ site.author.summary }}</p>
    <p class="hero-supporting">{{ site.author.supporting }}</p>

    <div class="profile-hero__actions">
      <a class="btn" href="#experience">
        Explore experience
        <i class="bi bi-arrow-down-right" aria-hidden="true"></i>
      </a>
      <a class="btn btn--ghost" href="{{ site.links.github }}" target="_blank" rel="noreferrer">
        <i class="bi bi-github" aria-hidden="true"></i>
        GitHub
      </a>
    </div>
  </div>

  <div class="profile-hero__portrait">
    <div class="portrait-index" aria-hidden="true">01 / 05</div>
    <img
      src="/assets/img/selfie2.jpeg"
      alt="Lucas Lydio, Full Stack Software Engineer"
      decoding="async"
      fetchpriority="high"
    />
    <p class="portrait-caption">
      <span>Current focus</span>
      Enterprise web systems / APIs / production reliability
    </p>
  </div>
</div>
