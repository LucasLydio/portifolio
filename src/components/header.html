<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="#top" aria-label="Lucas Lydio, back to top">
      <span class="brand__mark" aria-hidden="true">LL</span>
      <span class="brand__text">{{ site.title }}</span>
    </a>

    <nav class="nav nav--desktop" aria-label="Primary navigation">
      <a class="nav__link" href="#experience">Experience</a>
      <a class="nav__link" href="#interests">Interests</a>
      <a class="nav__link" href="#projects">Work</a>
      <a class="nav__link" href="#skills">Toolkit</a>
      <a class="nav__link" href="#contact">Contact</a>
      <button class="nav__icon" id="themeToggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <i class="bi bi-sun" aria-hidden="true"></i>
      </button>
    </nav>

    <div class="nav-actions">
      <button class="icon-btn" id="themeToggleMobile" type="button" aria-label="Switch color theme" title="Switch color theme">
        <i class="bi bi-sun" aria-hidden="true"></i>
      </button>
      <button class="icon-btn" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="mobileMenu" hidden>
    <nav class="mobile-menu__nav" aria-label="Mobile navigation">
      <a class="mobile-link" href="#experience">Experience</a>
      <a class="mobile-link" href="#interests">Interests</a>
      <a class="mobile-link" href="#projects">Work</a>
      <a class="mobile-link" href="#skills">Toolkit</a>
      <a class="mobile-link" href="#contact">Contact</a>
      <div class="mobile-menu__socials">
        <a href="{{ site.links.github }}" target="_blank" rel="noreferrer" aria-label="GitHub"><i class="bi bi-github" aria-hidden="true"></i></a>
        <a href="{{ site.links.linkedin }}" target="_blank" rel="noreferrer" aria-label="LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a>
      </div>
    </nav>
  </div>
</header>
